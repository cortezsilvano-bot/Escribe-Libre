packages:
  - .

allowBuilds:
  sharp: true
  unrs-resolver: true

# Security overrides. Each entry pins a transitive dependency above a
# high-severity advisory that the direct dependency has not yet picked up.
overrides:
  postcss: ^8.5.10
  sharp: ^0.35.0            # CVE-2026-33327/33328/35590/35591 (libvips)
  brace-expansion@1: ^1.1.18 # GHSA-mh99-v99m-4gvg
  brace-expansion@5: ^5.0.9  # GHSA-mh99-v99m-4gvg
  js-yaml: ^4.3.1           # CVE-2026-59870
  undici: ^7.29.0
