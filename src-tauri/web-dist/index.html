<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Textdoc</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background:
          linear-gradient(rgba(38, 230, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 79, 216, 0.04) 1px, transparent 1px),
          #050712;
        background-size: 48px 48px;
        color: #e8f7ff;
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        border: 1px solid rgba(38, 230, 255, 0.28);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
        padding: 28px;
        text-align: center;
        width: min(420px, calc(100vw - 32px));
      }

      h1 {
        font-size: 1.4rem;
        letter-spacing: 0;
        margin: 0 0 8px;
      }

      p {
        color: #9ab0c8;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Textdoc</h1>
      <p>Starting the local document server...</p>
    </main>
  </body>
</html>
